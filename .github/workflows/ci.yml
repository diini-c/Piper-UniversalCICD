name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Black
        run: black --check .
      - name: Mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pytest-cov
      - name: Run tests
        run: python -m pytest --cov=piper --cov-report=term-missing

  dogfood:
    name: Piper runs on itself
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      # The tool's whole promise is that it works on a real repository, so exercise
      # the CLI end to end rather than trusting unit tests alone.
      - name: Scan this repository
        run: piper scan --root . --report .pipeline/detection.json
      - name: Show the pipeline piper would generate
        run: piper generate --stdout
      - name: Preview install and test plans
        run: |
          piper install --dry-run
          piper test --dry-run
      - name: Upload detection report
        uses: actions/upload-artifact@v7
        with:
          name: detection-report
          path: .pipeline/detection.json

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: twine check dist/*
      # The Jinja templates are package data; a wheel without them ships a
      # `piper generate` that cannot find its own template.
      - name: Verify templates are packaged
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'piper/templates/github-actions.yml.j2'
          echo "templates present in wheel"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piper"
version = "0.1.0"
description = "Intelligent CI/CD with auto-detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "pathspec>=1.0",
  "tomli>=2.0; python_version<'3.11'"
]

[project.scripts]
piper = "piper.cli:main"

# Explicit discovery: relying on setuptools auto-discovery silently breaks
# the moment anything else lands in src/.
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piper = ["templates/*.j2"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "black>=24.8",
  "pre-commit>=3.8",
  "types-PyYAML>=6.0",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
files = ["src", "tests"]
exclude = '^(venv|\.venv|build|dist|.*egg-info|\.mypy_cache|\.ruff_cache)/'
strict = true

[[tool.mypy.overrides]]
module = ["rich.*", "tomli"]
ignore_missing_imports = true
